<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#a9c9ff" />
    <meta
      name="description"
      content="Um presente digital para Suyane, feito com amor."
    />
    <title>Dedicado à Suyane 💙</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="is-locked">
    <div class="hearts" id="hearts" aria-hidden="true"></div>

    <!-- Boas-vindas -->
    <section class="welcome glass" id="welcome" aria-labelledby="welcome-title">
      <div class="welcome-card">
        <i class="fa-solid fa-heart welcome-icon" aria-hidden="true"></i>
        <p>Tem uma surpresa esperando por você…</p>
        <h1 id="welcome-title">Oi, <span data-name></span></h1>
        <button class="btn" id="enter" type="button">
          <i class="fa-solid fa-envelope-open-text"></i> Entrar
        </button>
      </div>
    </section>

    <header class="site-header glass">
      <a class="logo" href="#hero">Com amor, <span data-from></span></a>
      <nav aria-label="Principal">
        <ul>
          <li><a href="#voce">Você</a></li>
          <li><a href="#momentos">Momentos</a></li>
          <li><a href="#contador">Contador</a></li>
          <li><a href="#carta">Carta</a></li>
        </ul>
      </nav>
      <i class="fa-solid fa-heart beat" aria-hidden="true"></i>
    </header>

    <main>
      <section class="hero" id="hero">
        <h1 class="mensagem" aria-label="I love you">ILOVEYOU</h1>
        <p class="ticker" aria-live="off">
          Você é <strong id="ticker">espetacular</strong>
        </p>
        <a class="scroll-hint" href="#voce" aria-label="Rolar para baixo"
          ><i class="fa-solid fa-chevron-down"></i
        ></a>
      </section>

      <section id="voce" class="section">
        <h2 class="section-title glass">Por que você é você</h2>
        <p class="hint">Toque em uma foto para abrir</p>
        <div class="cards-container" id="cards"></div>
      </section>

      <section id="momentos" class="section">
        <h2 class="section-title glass">Nossa história</h2>
        <div class="timeline" id="timeline"></div>
      </section>

      <section id="contador" class="section">
        <h2 class="section-title glass">Tempo juntos</h2>
        <div class="calendar-container" id="counter"></div>
        <p class="milestone glass" id="milestone"></p>
      </section>

      <section id="carta" class="section">
        <button class="btn btn-rose" id="open-letter" type="button">
          <i class="fa-solid fa-envelope-heart"></i> Abrir carta
        </button>
      </section>
    </main>

    <footer class="footer">
      Feito com <i class="fa-solid fa-heart"></i> por <span data-from></span>
    </footer>

    <!-- Galeria -->
    <div
      class="lightbox"
      id="lightbox"
      role="dialog"
      aria-modal="true"
      aria-label="Galeria"
      hidden
    >
      <button class="icon-btn lb-close" data-close aria-label="Fechar">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <button class="icon-btn lb-nav lb-prev" aria-label="Anterior">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <figure class="lb-figure glass">
        <img id="lb-img" alt="" />
        <figcaption>
          <h3 id="lb-title"></h3>
          <p id="lb-text"></p>
          <small id="lb-count"></small>
        </figcaption>
      </figure>
      <button class="icon-btn lb-nav lb-next" aria-label="Próxima">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>

    <!-- Carta -->
    <div
      class="letter-overlay"
      id="letter"
      role="dialog"
      aria-modal="true"
      aria-label="Carta"
      hidden
    >
      <button class="icon-btn lb-close" data-close aria-label="Fechar carta">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div class="envelope" id="envelope">
        <div class="env-flap"></div>
        <button
          class="seal"
          id="seal"
          type="button"
          aria-label="Abrir envelope"
        >
          <i class="fa-solid fa-heart"></i>
        </button>
        <p class="env-to">Para <span data-name></span></p>
      </div>
      <article class="paper" id="paper" tabindex="-1"></article>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
